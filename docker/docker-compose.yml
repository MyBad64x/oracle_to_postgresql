services:
  oracle:
    image: gvenzl/oracle-free:slim
    container_name: oracle_lh
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle_admin_pwd
      APP_USER: lh_user
      APP_USER_PASSWORD: lh_pwd
    volumes:
      - oracle_data:/opt/oracle/oradata

volumes:
  oracle_data: