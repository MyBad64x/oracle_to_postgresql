services:
  oracle:
    image: gvenzl/oracle-free:slim
    container_name: oracle_lh
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle_admin_pwd
      APP_USER: lh_user
      APP_USER_PASSWORD: lh_pwd
    volumes:
      - oracle_data:/opt/oracle/oradata

  postgres:
    image: postgres:16
    container_name: postgres_lh
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: lh_dw
      POSTGRES_USER: lh_etl
      POSTGRES_PASSWORD: lh_etl_pwd
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  oracle_data:
  postgres_data: